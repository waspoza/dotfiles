# tmux configuration
# Managed by tmuxpanel — Tmux Plugin Panel
#

# Enable mouse
set -g mouse on

# Window numbering
set -g base-index 1


set -g default-terminal screen-256color
set -g mode-keys emacs
set -g status-keys emacs
set -g display-time 4000
set -g history-limit 50000
# ── Plugins (managed by tmuxpanel) ──────────────────────
set -g @plugin 'arcticicestudio/nord-tmux'
run-shell '/home/piotr/.tmux/plugins/nord-tmux/nord.tmux'
set -g @plugin 'tmux-plugins/tmux-resurrect'
run-shell '/home/piotr/.tmux/plugins/tmux-resurrect/resurrect.tmux'
# ── End plugins ──────────────────────────────────────
