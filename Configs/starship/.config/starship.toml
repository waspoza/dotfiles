"$schema" = 'https://starship.rs/config-schema.json'
#[](#9A348E)\

format = """
$os\
$username$hostname\
[](bg:#33658A fg:#1a3446)\
$directory\
${custom.dir}\
[](fg:#33658A)\
$git_branch\
$git_status\
$git_commit\
${custom.git_arrow}\
[ ](fg:#33658A)
"""

# Disable the blank line at the start of the prompt
add_newline = false

[profiles]
transient = "${custom.transient} $character"

[character]
success_symbol = '[ \$](bold)'

[custom.dir]
command = "tidelike -s '  ~' -l 40"
style = "bg:#33658A"
format = "[ $output ]($style)"
when = true

[custom.transient]
command = "tidelike -s '~' -l 40"
format = "$output"
when = true

[git_branch]
style = "bg:#88c0d0 fg:#3b4252"
format = '[](fg:#88c0d0)[ $symbol$branch ]($style)'
only_attached = true

[git_status]
use_git_executable = true
style = "bg:#88c0d0 fg:#3b4252"
format = '[$all_status$ahead_behind]($style)'
up_to_date = '✓'

[git_commit]
style = "bg:#88c0d0 fg:#3b4252"
format = '[](fg:#88c0d0)[  #$hash$tag ]($style)'
only_detached = true

[custom.git_arrow]
# This command only succeeds in a git repo
#command = "echo '>'"
directories = [".git"]
when = "git rev-parse --is-inside-work-tree 2> /dev/null"
#style = "bold fg:white"                                   # Change color as you like
format = "[](fg:#88c0d0)"
# You can also replace your username with a neat symbol like   or disable this
# and use the os module below
[username]
show_always = true
style_user = "bg:#1a3446"
style_root = "bg:#1a3446"
format = '[$user]($style)'
disabled = false

[hostname]
ssh_only = false
style = "bg:#1a3446"
format = '[@$hostname ]($style)'
trim_at = '.companyname.com'
disabled = false

# An alternative to the username module which displays a symbol that
# represents the current operating system
[os]
style = "bg:#1a3446 fg:yellow"
disabled = false               # Disabled by default

[os.symbols]
CachyOS = "   "

[directory]
style = "bg:#DA627D"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"
home_symbol = "  ~"
fish_style_pwd_dir_length = 1
disabled = true

# Here is how you can shorten some long paths by text replacement
# similar to mapped_locations in Oh My Posh:
#[directory.substitutions]
#"Documents" = "󰈙 "
#"Downloads" = " "
#"Music" = " "
#"Pictures" = " "
# Keep in mind that the order matters. For example:
# "Important Documents" = " 󰈙 "
# will not be replaced, because "Documents" was already substituted before.
# So either put "Important Documents" before "Documents" or use the substituted version:
# "Important 󰈙 " = " 󰈙 "

[c]
symbol = " "
style = "bg:#86BBD8"
format = '[ $symbol ($version) ]($style)[](fg:#86BBD8 bg:#06969A)'

[cpp]
symbol = " "
style = "bg:#86BBD8"
format = '[ $symbol ($version) ]($style)[](fg:#86BBD8 bg:#06969A)'

[docker_context]
symbol = " "
style = "bg:#06969A"
format = '[ $symbol $context ]($style)[](fg:#06969A bg:#33658A)'

